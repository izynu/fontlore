<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Decision pipeline: brief, constraints, scored shortlist, pairing, handoff">
  <title>Fontlore decision pipeline</title>
  <rect x="0" y="0" width="1200" height="260" rx="14" fill="#F7F1E8"/>
  <rect x="1" y="1" width="1198" height="258" rx="13" fill="none" stroke="#E3D7C5" stroke-width="2"/>

  <!-- connector -->
  <line x1="80" y1="130" x2="1120" y2="130" stroke="#E3D7C5" stroke-width="2"/>
  <line x1="80" y1="130" x2="1120" y2="130" stroke="#A63D2F" stroke-width="2" stroke-dasharray="1040" stroke-dashoffset="1040">
    <animate attributeName="stroke-dashoffset" values="1040;0" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- traveling pulse -->
  <circle r="5" fill="#A63D2F" cy="130" cx="80">
    <animate attributeName="cx" values="80;1120" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="11" fill="none" stroke="#A63D2F" cy="130" cx="80" opacity="0">
    <animate attributeName="cx" values="80;1120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="6;14" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- stage boxes -->
  <g font-family="system-ui, 'Helvetica Neue', Arial, sans-serif">
    <!-- box template x positions: 60, 290, 520, 750, 980 (w 200) -->
    <g>
      <rect x="60" y="88" width="200" height="84" rx="10" fill="#FFFDF8" stroke="#D8CBB6" stroke-width="1.5"/>
      <rect x="60" y="164" width="200" height="8" rx="4" fill="#A63D2F" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.06;0.12;0.30;0.38" dur="6s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="160" y="124" text-anchor="middle" font-size="19" font-weight="600" fill="#1C1917">Brief</text>
      <text x="160" y="148" text-anchor="middle" font-size="13" fill="#6E6353">project in, questions out</text>
    </g>
    <g>
      <rect x="290" y="88" width="200" height="84" rx="10" fill="#FFFDF8" stroke="#D8CBB6" stroke-width="1.5"/>
      <rect x="290" y="164" width="200" height="8" rx="4" fill="#A63D2F" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.06;0.12;0.30;0.38" dur="6s" begin="1.3s" repeatCount="indefinite"/>
      </rect>
      <text x="390" y="124" text-anchor="middle" font-size="19" font-weight="600" fill="#1C1917">Constraints</text>
      <text x="390" y="148" text-anchor="middle" font-size="13" fill="#6E6353">scripts, license, medium</text>
    </g>
    <g>
      <rect x="520" y="88" width="200" height="84" rx="10" fill="#FFFDF8" stroke="#D8CBB6" stroke-width="1.5"/>
      <rect x="520" y="164" width="200" height="8" rx="4" fill="#A63D2F" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.06;0.12;0.30;0.38" dur="6s" begin="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="620" y="124" text-anchor="middle" font-size="19" font-weight="600" fill="#1C1917">Score</text>
      <text x="620" y="148" text-anchor="middle" font-size="13" fill="#6E6353">rubric, ranked shortlist</text>
    </g>
    <g>
      <rect x="750" y="88" width="200" height="84" rx="10" fill="#FFFDF8" stroke="#D8CBB6" stroke-width="1.5"/>
      <rect x="750" y="164" width="200" height="8" rx="4" fill="#A63D2F" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.06;0.12;0.30;0.38" dur="6s" begin="3.9s" repeatCount="indefinite"/>
      </rect>
      <text x="850" y="124" text-anchor="middle" font-size="19" font-weight="600" fill="#1C1917">Pair</text>
      <text x="850" y="148" text-anchor="middle" font-size="13" fill="#6E6353">heading plus body, tested</text>
    </g>
    <g>
      <rect x="980" y="88" width="200" height="84" rx="10" fill="#FFFDF8" stroke="#D8CBB6" stroke-width="1.5"/>
      <rect x="980" y="164" width="200" height="8" rx="4" fill="#A63D2F" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.06;0.12;0.30;0.38" dur="6s" begin="5.2s" repeatCount="indefinite"/>
      </rect>
      <text x="1080" y="124" text-anchor="middle" font-size="19" font-weight="600" fill="#1C1917">Handoff</text>
      <text x="1080" y="148" text-anchor="middle" font-size="13" fill="#6E6353">CSS, tokens, evidence</text>
    </g>
  </g>

  <!-- step numbers -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#A63D2F">
    <text x="60" y="76">01</text>
    <text x="290" y="76">02</text>
    <text x="520" y="76">03</text>
    <text x="750" y="76">04</text>
    <text x="980" y="76">05</text>
  </g>

  <text x="600" y="232" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#6E6353" letter-spacing="1">
    python3 scripts/decide.py --project dashboard --script latin --tone neutral
  </text>
</svg>
